<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderation Portal | The Thank-You Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { paper: '#F7F4EA', forest: '#2D5A4C', terracotta: '#D95338' },
          fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F7F4EA] text-[#2D5A4C] font-sans antialiased min-h-screen">
  <div class="flex flex-col items-center px-4 md:px-8 py-8 max-w-5xl mx-auto">
    
    <div id="login-overlay" class="fixed inset-0 bg-[#2D5A4C] z-50 flex items-center justify-center p-4">
      <div class="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl text-center">
        <div class="w-12 h-12 bg-[#2D5A4C]/10 text-[#2D5A4C] text-2xl rounded-2xl flex items-center justify-center mx-auto mb-4">🔒</div>
        <h1 class="font-serif text-2xl font-bold mb-2">Admin Portal</h1>
        <p class="text-xs text-[#2D5A4C]/70 mb-6">Restricted management access for authorized staff.</p>
        <form onsubmit="authenticate(event)" class="space-y-4">
          <input type="password" id="passcode" placeholder="Enter Security PIN" class="w-full bg-[#F7F4EA] border border-[#2D5A4C]/20 rounded-xl px-4 py-3 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-[#D95338]" required />
          <button type="submit" class="w-full bg-[#D95338] text-white font-semibold text-xs tracking-widest uppercase py-3.5 rounded-xl hover:bg-[#D95338]/90 transition">
            Unlock Dashboard
          </button>
        </form>
      </div>
    </div>

    <header class="w-full border-b border-[#2D5A4C]/15 pb-6 mb-10 flex justify-between items-center">
      <div>
        <span class="text-xs uppercase tracking-widest text-[#D95338] font-semibold block mb-1">Internal Control</span>
        <h1 class="font-serif text-3xl font-bold">Content Moderation</h1>
      </div>
      <button onclick="logout()" class="text-xs bg-[#D95338] text-white font-semibold uppercase tracking-wider px-4 py-2 rounded-xl">Exit Admin</button>
    </header>

    <div class="flex space-x-4 mb-8 w-full border-b border-[#2D5A4C]/10 pb-4">
      <button onclick="switchTab('notes')" id="tab-notes" class="text-xs font-semibold uppercase tracking-widest px-5 py-2.5 rounded-xl bg-[#2D5A4C] text-white">Manage Notes</button>
      <button onclick="switchTab('gallery')" id="tab-gallery" class="text-xs font-semibold uppercase tracking-widest px-5 py-2.5 rounded-xl bg-[#2D5A4C]/10 text-[#2D5A4C]">Manage Photos</button>
    </div>

    <section id="notes-section" class="w-full">
      <h2 class="font-serif text-xl font-bold mb-4">Live Note Wall Messages</h2>
      <div id="admin-notes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <section id="gallery-section" class="w-full hidden">
      <h2 class="font-serif text-xl font-bold mb-4">Uploaded Gallery Photos</h2>
      <div id="admin-gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </section>

  </div>
<script>
  const NOTES_BIN_ID = "6a96b10ef5f4af5e295c07d4"; // Notes Bin ID
  const GALLERY_BIN_ID = "6a96b10ef5f4af5e295c07d4";  // Insert Gallery Bin ID
  const ACCESS_KEY = "$2a$10$3bxhzMyIwoZoitZ8QhXn9uO3CfqlluwtQle4bIl8SP/ofAp9xbV8a"; // Access key with Update permissions
  const ADMIN_PASSWORD = "TEA@DENT"
  let currentTab = "notes";

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('notes-section').classList.toggle('hidden', tab !== 'notes');
    document.getElementById('gallery-section').classList.toggle('hidden', tab !== 'gallery');
    
    if (tab === 'notes') loadAdminNotes();
    if (tab === 'gallery') loadAdminGallery();
  }

  // --- WALL NOTES MANAGEMENT ---
  async function loadAdminNotes() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${NOTES_BIN_ID}/latest`, {
        headers: { "X-Access-Key": ACCESS_KEY }
      });
      const data = await res.json();
      const notes = Array.isArray(data.record) ? data.record : [];
      const container = document.getElementById('admin-notes-list');
      container.innerHTML = "";

      notes.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow border border-black/10 flex justify-between items-center mb-3 break-all";
        card.innerHTML = `
          <div>
            <p class="font-serif text-sm font-bold text-gray-800">"${item.message}"</p>
            <span class="text-xs text-gray-500">— ${item.author}</span>
          </div>
          <button onclick="deleteNote(${index})" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-red-700 ml-4 shrink-0">
            🗑️ Delete
          </button>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      console.error("Error loading admin notes:", e);
    }
  }

  async function deleteNote(index) {
    if (!confirm("Are you sure you want to delete this note?")) return;
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${NOTES_BIN_ID}/latest`, {
        headers: { "X-Access-Key": ACCESS_KEY }
      });
      const data = await res.json();
      let notes = Array.isArray(data.record) ? data.record : [];

      notes.splice(index, 1); // Delete by index position

      await fetch(`https://api.jsonbin.io/v3/b/${NOTES_BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Access-Key": ACCESS_KEY,
          "X-Bin-Versioning": "false"
        },
        body: JSON.stringify(notes)
      });

      alert("Note deleted successfully!");
      loadAdminNotes();
    } catch (e) {
      alert("Error deleting note.");
    }
  }

  // --- GALLERY MANAGEMENT ---
  async function loadAdminGallery() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}/latest`, {
        headers: { "X-Access-Key": ACCESS_KEY }
      });
      const data = await res.json();
      const photos = Array.isArray(data.record) ? data.record : [];
      const container = document.getElementById('admin-gallery-list');
      container.innerHTML = "";

      photos.forEach((photo, index) => {
        let caption = "Cherished Memory";
        let url = "";

        if (typeof photo === 'string') {
          url = photo;
        } else if (photo && typeof photo === 'object') {
          url = photo.url || photo.image || "";
          if (photo.caption && photo.caption !== "undefined") caption = photo.caption;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow border border-black/10 flex justify-between items-center mb-3 break-all";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            ${url ? `<img src="${url}" class="w-12 h-12 object-cover rounded-lg" onerror="this.src='https://via.placeholder.com/50';" />` : ''}
            <div>
              <p class="font-serif text-sm font-bold text-gray-800">${caption}</p>
            </div>
          </div>
          <button onclick="deletePhoto(${index})" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-red-700 ml-4 shrink-0">
            🗑️ Delete
          </button>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      console.error("Error loading admin gallery:", e);
    }
  }

  async function deletePhoto(index) {
    if (!confirm("Are you sure you want to delete this photo entry?")) return;
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}/latest`, {
        headers: { "X-Access-Key": ACCESS_KEY }
      });
      const data = await res.json();
      let photos = Array.isArray(data.record) ? data.record : [];

      photos.splice(index, 1); // Delete photo by exact array position

      await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Access-Key": ACCESS_KEY,
          "X-Bin-Versioning": "false"
        },
        body: JSON.stringify(photos)
      });

      alert("Photo deleted successfully!");
      loadAdminGallery();
    } catch (e) {
      alert("Error deleting photo.");
    }
  }

  window.onload = loadAdminNotes;
</script>

</body>
</html>
