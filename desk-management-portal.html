<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - Teacher's Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F4EA] min-h-screen text-[#2D5A4C]">

  <!-- PASSWORD LOGIN OVERLAY -->
  <div id="login-overlay" class="fixed inset-0 bg-[#2D5A4C] flex items-center justify-center p-4 z-50">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
      <div class="w-12 h-12 bg-[#2D5A4C]/10 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl">
        🔒
      </div>
      <h2 class="font-serif text-2xl font-bold text-[#2D5A4C] mb-1">Admin Portal</h2>
      <p class="text-xs text-gray-500 mb-6">Restricted management access for authorized staff.</p>

      <form onsubmit="checkPassword(event)">
        <input 
          type="password" 
          id="password-input" 
          placeholder="Enter password..." 
          class="w-full bg-gray-100 p-3 rounded-xl text-center text-sm mb-4 focus:outline-none border border-black/10"
          required 
        />
        <button 
          type="submit" 
          class="w-full bg-[#D95338] hover:bg-[#c0432a] text-white py-3 rounded-xl text-xs font-bold tracking-wider transition duration-300">
          UNLOCK DASHBOARD
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN ADMIN DASHBOARD (HIDDEN UNTIL UNLOCKED) -->
  <div id="admin-content" class="hidden max-w-4xl mx-auto px-4 py-8">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8 border-b border-[#2D5A4C]/10 pb-4">
      <div>
        <h1 class="font-serif text-2xl font-bold">Admin Management Portal</h1>
        <p class="text-xs opacity-75">Moderate Note Wall messages and Gallery uploads</p>
      </div>
      <button onclick="logout()" class="bg-gray-200 hover:bg-gray-300 text-xs px-4 py-2 rounded-xl font-semibold">
        🔒 Lock Dashboard
      </button>
    </div>

    <!-- TAB BUTTONS -->
    <div class="flex gap-3 mb-6">
      <button id="tab-notes-btn" onclick="switchTab('notes')" class="bg-[#2D5A4C] text-white px-5 py-2.5 rounded-xl text-xs font-bold">
        📝 MANAGE NOTES
      </button>
      <button id="tab-gallery-btn" onclick="switchTab('gallery')" class="bg-white text-[#2D5A4C] border border-[#2D5A4C]/20 px-5 py-2.5 rounded-xl text-xs font-bold">
        🖼️ MANAGE PHOTOS
      </button>
    </div>

    <!-- NOTES SECTION -->
    <div id="notes-section">
      <h2 class="font-serif text-lg font-bold mb-4">Wall Messages</h2>
      <div id="admin-notes-list" class="space-y-3">
        <p class="text-xs text-gray-500">Loading notes...</p>
      </div>
    </div>

    <!-- GALLERY SECTION -->
    <div id="gallery-section" class="hidden">
      <h2 class="font-serif text-lg font-bold mb-4">Uploaded Gallery Photos</h2>
      <div id="admin-gallery-list" class="space-y-3">
        <p class="text-xs text-gray-500">Loading photos...</p>
      </div>
    </div>

  </div>

  <script>
    // CONFIGURATION
    const ADMIN_PASSWORD = "TEA@DENT"; // Replace "123" with your chosen password
    const NOTES_BIN_ID = "6a96b0c9f5f4af5e295c0658"; // Notes Bin ID
    const GALLERY_BIN_ID = "6a96b10ef5f4af5e295c07d4E";  // Insert Gallery Bin ID
    const ACCESS_KEY = "$2a$10$3bxhzMyIwoZoitZ8QhXn9uO3CfqlluwtQle4bIl8SP/ofAp9xbV8a"; // Access key with Read & Update permissions

    let currentTab = "notes";

    // UNLOCK DASHBOARD FUNCTION
    function checkPassword(event) {
      if (event) event.preventDefault();

      const input = document.getElementById('password-input').value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        loadAdminNotes();
      } else {
        alert("Incorrect password. Please try again.");
      }
    }

    function logout() {
      document.getElementById('password-input').value = "";
      document.getElementById('admin-content').classList.add('hidden');
      document.getElementById('login-overlay').classList.remove('hidden');
    }

    // TAB SWITCHING
    function switchTab(tab) {
      currentTab = tab;
      const notesBtn = document.getElementById('tab-notes-btn');
      const galleryBtn = document.getElementById('tab-gallery-btn');

      document.getElementById('notes-section').classList.toggle('hidden', tab !== 'notes');
      document.getElementById('gallery-section').classList.toggle('hidden', tab !== 'gallery');

      if (tab === 'notes') {
        notesBtn.className = "bg-[#2D5A4C] text-white px-5 py-2.5 rounded-xl text-xs font-bold";
        galleryBtn.className = "bg-white text-[#2D5A4C] border border-[#2D5A4C]/20 px-5 py-2.5 rounded-xl text-xs font-bold";
        loadAdminNotes();
      } else {
        galleryBtn.className = "bg-[#2D5A4C] text-white px-5 py-2.5 rounded-xl text-xs font-bold";
        notesBtn.className = "bg-white text-[#2D5A4C] border border-[#2D5A4C]/20 px-5 py-2.5 rounded-xl text-xs font-bold";
        loadAdminGallery();
      }
    }

    // LOAD AND DELETE WALL NOTES
    async function loadAdminNotes() {
      const container = document.getElementById('admin-notes-list');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${NOTES_BIN_ID}/latest`, {
          headers: { "X-Access-Key": ACCESS_KEY }
        });
        const data = await res.json();
        const notes = Array.isArray(data.record) ? data.record : [];
        container.innerHTML = "";

        if (notes.length === 0) {
          container.innerHTML = `<p class="text-xs text-gray-500">No wall notes found.</p>`;
          return;
        }

        notes.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-2xl shadow border border-black/10 flex justify-between items-center break-all";
          card.innerHTML = `
            <div class="pr-4">
              <p class="font-serif text-sm font-bold text-gray-800">"${item.message}"</p>
              <span class="text-xs text-gray-500">— ${item.author}</span>
            </div>
            <button onclick="deleteNote(${index})" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shrink-0">
              🗑️ Delete
            </button>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<p class="text-xs text-red-500">Error loading notes. Check API configuration.</p>`;
      }
    }

    async function deleteNote(index) {
      if (!confirm("Are you sure you want to delete this note?")) return;
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${NOTES_BIN_ID}/latest`, {
          headers: { "X-Access-Key": ACCESS_KEY }
        });
        const data = await res.json();
        let notes = Array.isArray(data.record) ? data.record : [];

        notes.splice(index, 1);

        await fetch(`https://api.jsonbin.io/v3/b/${NOTES_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Access-Key": ACCESS_KEY,
            "X-Bin-Versioning": "false"
          },
          body: JSON.stringify(notes)
        });

        alert("Note deleted successfully!");
        loadAdminNotes();
      } catch (e) {
        alert("Error deleting note.");
      }
    }

    // LOAD AND DELETE GALLERY PHOTOS
    async function loadAdminGallery() {
      const container = document.getElementById('admin-gallery-list');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}/latest`, {
          headers: { "X-Access-Key": ACCESS_KEY }
        });
        const data = await res.json();
        const photos = Array.isArray(data.record) ? data.record : [];
        container.innerHTML = "";

        if (photos.length === 0) {
          container.innerHTML = `<p class="text-xs text-gray-500">No photos found.</p>`;
          return;
        }

        photos.forEach((photo, index) => {
          let caption = "Cherished Memory";
          let url = "";

          if (typeof photo === 'string') {
            url = photo;
          } else if (photo && typeof photo === 'object') {
            url = photo.url || photo.image || "";
            if (photo.caption && photo.caption !== "undefined") caption = photo.caption;
          }

          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-2xl shadow border border-black/10 flex justify-between items-center break-all";
          card.innerHTML = `
            <div class="flex items-center gap-3 pr-4">
              ${url ? `<img src="${url}" class="w-12 h-12 object-cover rounded-xl bg-gray-100" onerror="this.style.display='none';" />` : ''}
              <div>
                <p class="font-serif text-sm font-bold text-gray-800">${caption}</p>
              </div>
            </div>
            <button onclick="deletePhoto(${index})" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shrink-0">
              🗑️ Delete
            </button>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<p class="text-xs text-red-500">Error loading gallery photos. Check API configuration.</p>`;
      }
    }

    async function deletePhoto(index) {
      if (!confirm("Are you sure you want to delete this photo entry?")) return;
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}/latest`, {
          headers: { "X-Access-Key": ACCESS_KEY }
        });
        const data = await res.json();
        let photos = Array.isArray(data.record) ? data.record : [];

        photos.splice(index, 1);

        await fetch(`https://api.jsonbin.io/v3/b/${GALLERY_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Access-Key": ACCESS_KEY,
            "X-Bin-Versioning": "false"
          },
          body: JSON.stringify(photos)
        });

        alert("Photo entry deleted successfully!");
        loadAdminGallery();
      } catch (e) {
        alert("Error deleting photo entry.");
      }
    }
  </script>
</body>
</html>
